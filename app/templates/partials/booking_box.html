{# Rakuten Travel + A8.net banners #}
<div class="booking-section booking-section--prominent" role="complementary" aria-label="{{ '예약 안내' if lang == 'ko' else 'Booking links' }}">
    <p class="booking-title">{{ booking_title }}</p>
    <p class="booking-desc">{{ booking_desc }}</p>
    <div class="booking-actions">
        {% if rakuten_search_url %}
        <a href="{{ rakuten_search_url }}"
           target="_blank"
           rel="nofollow sponsored noopener noreferrer"
           class="btn-rakuten"
           title="{{ ('라쿠텐 트래블에서 ' ~ region_label ~ ' 검색 (새 탭)') if lang == 'ko' else ('Search ' ~ region_label ~ ' on Rakuten Travel (new tab)') }}"
           data-track="affiliate_rakuten"
           data-track-label="{{ region_label }}">
            {{ rakuten_button_label }}
        </a>
        {% endif %}
    </div>
    <p class="booking-note">
        {{ '제휴 링크 · 새 탭에서 열림' if lang == 'ko' else 'Affiliate links · opens in new tab' }}
    </p>
</div>
{% include 'partials/a8_banners.html' %}
